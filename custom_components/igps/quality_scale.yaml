rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Bluetooth discovery only; the device is passive and often out of range at setup time.
  test-before-setup:
    status: exempt
    comment: The first read runs in the background on purpose, so a device that is off does not block boot (entities restore their last state).
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Bluetooth device without credentials.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: todo
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one bike computer.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: The only setting is the Bluetooth address, which identifies the device.
  repair-issues:
    status: exempt
    comment: Failures surface through entity availability; nothing needs a repair flow.
  stale-devices:
    status: exempt
    comment: One config entry is one device; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Bluetooth integration, no HTTP session.
  strict-typing: todo
